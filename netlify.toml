[build]
  publish = "dist"
  command = "npm run build:all"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/submit-idee"
  to = "/.netlify/functions/submit-idea"
  status = 200

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact-api"
  status = 200

# API functions — POST only, JSON responses
[[headers]]
  for = "/api/*"
  [headers.values]
    Content-Type = "application/json"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://plausible.io; connect-src 'self' https://plausible.io; object-src 'none'"
